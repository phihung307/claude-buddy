name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --release
      - run: cargo build --release
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/claude-buddy-rs.exe -Algorithm SHA256).Hash
          "$hash  claude-buddy-rs.exe" | Out-File -Encoding ascii target/release/claude-buddy-rs.exe.sha256
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/claude-buddy-rs.exe target/release/claude-buddy-rs.exe.sha256 --generate-notes --prerelease
